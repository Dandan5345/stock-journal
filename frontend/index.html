<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>יומן מסחר</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <header class="page-header">
      <h1>יומן מסחר</h1>
      <p class="subtitle">מעקב אחר עסקאות קנייה במניות</p>
    </header>

    <section id="stock-preview" class="stock-preview" hidden aria-live="polite">
      <div class="stock-preview-top">
        <div class="stock-identity">
          <p id="preview-symbol" class="preview-symbol"></p>
          <p id="preview-name" class="preview-name"></p>
          <p id="preview-exchange" class="preview-exchange"></p>
        </div>
        <div class="stock-price-block">
          <p id="preview-price" class="preview-price"></p>
          <p id="preview-change" class="preview-change"></p>
        </div>
      </div>
      <div class="chart-wrap">
        <svg id="preview-chart" class="preview-chart" viewBox="0 0 640 160" preserveAspectRatio="none" aria-hidden="true"></svg>
        <p id="chart-empty" class="chart-empty" hidden>אין נתוני גרף להיום</p>
      </div>
    </section>

    <main class="layout">
      <section class="card" aria-labelledby="form-title">
        <h2 id="form-title">הוספת עסקה חדשה</h2>
        <form id="trade-form" novalidate>
          <div class="field ticker-field">
            <label for="ticker">טיקר</label>
            <input
              type="text"
              id="ticker"
              name="ticker"
              placeholder="לדוגמה AAPL או Apple"
              autocomplete="off"
              required
            />
            <ul id="ticker-suggestions" class="suggestions" hidden></ul>
          </div>

          <div class="field">
            <label for="buy-price">מחיר למניה</label>
            <input
              type="number"
              id="buy-price"
              name="buy-price"
              placeholder="נטען מ־Yahoo Finance"
              step="0.01"
              min="0"
              required
            />
          </div>

          <div class="field">
            <span class="field-label">איך תרצו להזין?</span>
            <div class="mode-toggle" role="group" aria-label="מצב הזנה">
              <button type="button" class="mode-btn is-active" data-mode="shares" id="mode-shares">
                כמות מניות
              </button>
              <button type="button" class="mode-btn" data-mode="amount" id="mode-amount">
                סכום כסף
              </button>
            </div>
          </div>

          <div class="field" id="shares-field">
            <label for="quantity">כמה מניות קניתם?</label>
            <input
              type="number"
              id="quantity"
              name="quantity"
              placeholder="לדוגמה 3"
              step="any"
              min="0"
            />
          </div>

          <div class="field" id="amount-field" hidden>
            <label for="amount">בכמה כסף קניתם?</label>
            <input
              type="number"
              id="amount"
              name="amount"
              placeholder="לדוגמה 50"
              step="0.01"
              min="0"
            />
          </div>

          <p id="calc-summary" class="calc-summary" hidden></p>

          <div class="field">
            <label for="buy-date">תאריך קנייה</label>
            <input type="date" id="buy-date" name="buy-date" required />
          </div>

          <button type="submit" id="submit-btn">
            <span class="btn-label">הוספת עסקה</span>
          </button>

          <p id="form-error" class="form-error" role="alert" hidden></p>
        </form>
      </section>

      <section class="card" aria-labelledby="trades-title">
        <div class="card-header-row">
          <h2 id="trades-title">העסקאות שלי</h2>
        </div>

        <p id="status-message" class="status-message" role="status"></p>

        <div class="table-wrap">
          <table id="trades-table" class="trades-table" hidden>
            <thead>
              <tr>
                <th scope="col">טיקר</th>
                <th scope="col">מחיר קנייה</th>
                <th scope="col">כמות</th>
                <th scope="col">סה״כ</th>
                <th scope="col">תאריך קנייה</th>
              </tr>
            </thead>
            <tbody id="trades-body"></tbody>
          </table>
        </div>

        <p id="empty-message" class="empty-message" hidden>
          עדיין אין עסקאות. הוסיפו את הראשונה למעלה.
        </p>
      </section>
    </main>

    <footer class="page-footer">
      <p id="api-indicator"></p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
